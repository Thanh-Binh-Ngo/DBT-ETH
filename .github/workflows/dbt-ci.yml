# CI-Pipeline für das dbt-Projekt.
# Wird automatisch ausgelöst, sobald ein Pull Request gegen den master-Branch
# geöffnet oder aktualisiert wird. Prüft, ob alle dbt-Modelle fehlerfrei bauen
# und alle Tests in Snowflake (CI-Target) bestehen.
name: dbt CI

# Trigger: bei jedem PR gegen master
on:
  pull_request:
    branches:
      - main

jobs:
  dbt-run:
    runs-on: ubuntu-latest
    environment: DBT_ETH

    env:
      # Privater RSA-Schlüssel für die Snowflake-Authentifizierung (aus GitHub Secrets)
      DBT_PRIVATE_KEY: ${{ secrets.DBT_PRIVATE_KEY }}
      DBT_PRIVATE_KEY_PATH: /home/runner/.dbt/rsa_key.p8
      DBT_SNOWFLAKE_IDENTIFIER: ${{ secrets.DBT_SNOWFLAKE_IDENTIFIER }}
      DBT_SNOWFLAKE_ROLE: ${{ secrets.DBT_SNOWFLAKE_ROLE }}
      DBT_SNOWFLAKE_USER: ${{ secrets.DBT_SNOWFLAKE_USER }}
      DBT_SCHEMA: pr_${{ github.event.pull_request.number }}

    steps:
      # 1. Quellcode in die CI-Umgebung laden
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2. Python installieren
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12.10"

      # 3. dbt-core und dbt-snowflake installieren
      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core==1.9.4 dbt-snowflake==1.9.4

      # 4. dbt-Profil und privaten Schlüssel einrichten
      #    profiles.yml wird aus .dbt/ ins Homeverzeichnis kopiert,
      #    der RSA-Schlüssel aus dem Secret als Datei gespeichert.
      - name: Set up dbt profile + private key
        run: |
          mkdir -p ~/.dbt
          cp .github/workflows/.dbt/profiles.yml ~/.dbt/profiles.yml
          echo "$DBT_PRIVATE_KEY" > ~/.dbt/rsa_key.p8
          chmod 600 ~/.dbt/rsa_key.p8

      # 5. dbt-Packages aus packages.yml installieren
      - name: Install dbt deps
        run: dbt deps

      # 6. Verbindung zu Snowflake testen
      - name: Run dbt debug
        run: dbt debug --target ci

      # 7. Alle Modelle, Tests und Snapshots gegen das CI-Target ausführen
      - name: Run dbt seed
        run: dbt seed --target ci

      # 8. Alle Modelle, Tests und Snapshots gegen das CI-Target ausführen
      - name: Run dbt
        run: dbt run --target ci

      # 9. CI-Schema in Snowflake löschen — läuft immer, auch bei Fehler
      #- name: Cleanup CI schema
      #  if: always()
      #  run: dbt run-operation drop_ci_schema --target ci