dbt_eth:
  outputs:
    ci:
      account: "{{env_var('DBT_SNOWFLAKE_IDENTIFIER')}}"
      database: "{{env_var('DBT_DATABASE')}}"
      private_key_path: "{{env_var('DBT_PRIVATE_KEY_PATH')}}"
      password: 
      role: "{{env_var('DBT_SNOWFLAKE_ROLE')}}"
      schema: "{{env_var('DBT_SCHEMA')}}"
      threads: 1
      type: snowflake
      user: "{{env_var('DBT_SNOWFLAKE_USER')}}"
      warehouse: COMPUTE_WH

    prod:
      account: "{{env_var('DBT_PROD_SNOWFLAKE_IDENTIFIER')}}"
      database: "{{env_var('DBT_PROD_DATABASE')}}"
      private_key_path: "{{env_var('DBT_PRIVATE_KEY_PATH')}}"
      password:
      role: "{{env_var('DBT_PROD_SNOWFLAKE_ROLE')}}"
      schema: "{{env_var('DBT_PROD_SCHEMA')}}"
      threads: 4
      type: snowflake
      user: "{{env_var('DBT_PROD_SNOWFLAKE_USER')}}"
      warehouse: COMPUTE_WH
  target: ci
