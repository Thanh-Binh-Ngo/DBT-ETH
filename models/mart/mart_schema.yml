version: 2

# ============================================================
# VERFÜGBARE EIGENSCHAFTEN AUF MODEL-EBENE
# ============================================================
# - name:             (required) Modellname (muss mit Dateiname übereinstimmen)
# - description:      Freitext, unterstützt > (inline) und | (mehrzeilig)
# - group:            Zuordnung zu einer Gruppe (definiert in groups.yml)
# - access:           Sichtbarkeit: private | protected | public
# - config:           Inline-Konfiguration (entspricht dbt_project.yml):
#     materialized:       table | view | incremental | ephemeral
#     schema:             Zielschema (überschreibt default)
#     alias:              Tabellenname in der Datenbank
#     tags:               Liste von Tags für Selektion (z.B. [daily, finance])
#     meta:               Beliebige Key-Value-Metadaten (z.B. owner, team)
#     enabled:            true | false – Modell aktivieren/deaktivieren
#     on_schema_change:   ignore | fail | append_new_columns | sync_all_columns
#     full_refresh:       true | false – überschreibt --full-refresh Flag
#     contract:
#       enforced:         true | false – Spaltentypen werden geprüft
# - constraints:      Datenbank-Constraints (requires contract.enforced: true)
# - latest_version:   Aktuelle Standardversion bei versionierten Modellen
# - versions:         Liste aller Versionen (siehe mart_contract_overview)
# - deprecation_date: Datum ab dem das Modell als veraltet gilt (ISO 8601)
# - docs:
#     show:           true | false – in dbt docs anzeigen
#     node_color:     Farbe im Lineage-Graph (z.B. "#FF5733")
# - columns:          Liste aller Spalten (siehe unten)
# - tests:            Tests auf Model-Ebene (z.B. unique-Kombinationen)
#
# ============================================================
# VERFÜGBARE EIGENSCHAFTEN AUF SPALTEN-EBENE
# ============================================================
# - name:             (required) Spaltenname
# - description:      Beschreibung der Spalte
# - data_type:        Datentyp (z.B. varchar, number, boolean) – für contracts
# - constraints:      Datenbank-Constraints: not_null | unique | primary_key |
#                     foreign_key | check (requires contract.enforced: true)
# - meta:             Beliebige Key-Value-Metadaten (z.B. pii: true)
# - quote:            true | false – Spaltenname in Anführungszeichen
# - tests:            Liste von Tests:
#     - not_null
#     - unique
#     - accepted_values:
#         values: [a, b, c]
#     - relationships:
#         to: ref('other_model')
#         field: id
# - tags:             Tags für Selektion
# - docs:
#     show:           true | false
# ============================================================

models:
  - name: mart_token_activity
    description: >
      Tägliche Token-Transfer-Aktivität aggregiert pro Token-Contract.
      Geeignet für Analysen zu Transfervolumen, Nutzungsfrequenz und aktiven Wallets.
      Granularität: ein Datensatz pro Token-Contract und Tag.
    columns:
      - name: TOKEN_ADDRESS
        description: "Adresse des Token-Contracts (Referenz auf stg_eth_contracts.ADDRESS)."
        tests:
          - not_null
      - name: DATE
        description: "Datum der Aktivität."
        tests:
          - not_null
      - name: TOTAL_TRANSFERS
        description: "Gesamtanzahl der Token-Transfers an diesem Tag."
      - name: TOTAL_VOLUME
        description: "Gesamtvolumen aller Token-Transfers an diesem Tag in Wei."
      - name: UNIQUE_SENDERS
        description: "Anzahl eindeutiger Sender-Adressen an diesem Tag."
      - name: UNIQUE_RECEIVERS
        description: "Anzahl eindeutiger Empfänger-Adressen an diesem Tag."

  - name: mart_contract_overview
    latest_version: 2
    description: |
      Breite Contract-Übersichtstabelle für BI-Tools und Dashboards.

      Kombiniert zwei Quellen:
      - Deployment-Details aus core_eth_contracts_deployments (Deployer, Gas, Status)
      - Aktivitäts-Metriken aus core_eth_contracts_activity (Volumen, Transfers)

      Granularität: ein Datensatz pro Smart Contract.
    versions:
      - v: 1
        defined_in: mart_contract_overview
        deprecation_date: 2026-04-01
      - v: 2
        columns:
          - include: all
            exclude: [DEPLOYMENT_GAS_PRICE, DEPLOYMENT_STATUS]
    columns:
      - name: ADDRESS
        description: "Eindeutige Adresse des Smart Contracts."
        tests:
          - unique
          - not_null
      - name: DEPLOYMENT_DATE
        description: "Datum, an dem der Contract deployed wurde."
      - name: DEPLOYER_ADDRESS
        description: "Adresse des Wallets, das den Contract deployed hat."
      - name: DEPLOYMENT_TX_HASH
        description: "Hash der Deployment-Transaktion."
      - name: DEPLOYMENT_GAS_USED
        description: "Tatsächlich verbrauchtes Gas für das Deployment."
      - name: DEPLOYMENT_GAS_PRICE
        description: "Effektiver Gas-Preis der Deployment-Transaktion in Wei."
      - name: DEPLOYMENT_STATUS
        description: "Status der Deployment-Transaktion: 1 = Erfolg, 0 = Fehler."
      - name: TOTAL_TRANSFERS
        description: "Gesamtanzahl der Token-Transfers über diesen Contract."
      - name: TOTAL_VOLUME
        description: "Gesamtvolumen aller Token-Transfers in Wei."
      - name: FIRST_TRANSFER_AT
        description: "Zeitstempel des ersten Token-Transfers über diesen Contract."
      - name: LAST_TRANSFER_AT
        description: "Zeitstempel des letzten Token-Transfers über diesen Contract."
